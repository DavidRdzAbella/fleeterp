# Los tres servicios corren por separado a propósito: la API y el portal son
# despliegues independientes y cada uno puede escalarse o actualizarse solo.
#
#   docker compose up --build
#   Portal   http://localhost:5100
#   API      http://localhost:5200/swagger

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleeterp-db
    environment:
      POSTGRES_DB: fleeterp
      POSTGRES_USER: fleeterp
      POSTGRES_PASSWORD: fleeterp
    ports:
      - "5432:5432"
    volumes:
      - fleeterp-data:/var/lib/postgresql/data
    healthcheck:
      # La API aplica migraciones al arrancar: no debe iniciar antes que la base.
      test: ["CMD-SHELL", "pg_isready -U fleeterp -d fleeterp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FleetErp.Api/Dockerfile
    container_name: fleeterp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fleeterp;Username=fleeterp;Password=fleeterp"
      Database__Provider: "PostgreSql"
      Database__AutoMigrate: "true"
      # Deje en true la primera vez para tener la empresa de demostración.
      Database__SeedDemoData: "true"
      # Cámbiela antes de exponer el servicio fuera de su red.
      Jwt__SigningKey: "D7avid-Richi3e-FleetErp.Api"
      Cors__AllowedOrigins__0: "http://localhost:5100"
    ports:
      - "5200:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: src/FleetErp.Web/Dockerfile
    container_name: fleeterp-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Dentro de la red de compose el portal llama al contenedor por su nombre.
      Api__BaseUrl: "http://api:8080"
    ports:
      - "5100:8080"

volumes:
  fleeterp-data:
